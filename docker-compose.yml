services:
  db:
    image: mysql
    container_name: db_site-ernest
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - $IP:3306:3306
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      - dev

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_docker_symfony
    depends_on:
      - db
    ports:
      - $IP:3047:3047
    environment:
      PMA_HOST: db
    volumes:
      - ./php/php.ini:/usr/local/etc/php/conf.d/php.ini
    networks:
      - dev

  php:
    build: php
    container_name: www_site-ernest
    ports:
      - $IP:80:80
    volumes:
      - ./php/vhosts:/etc/apache2/sites-enabled
      - ./:/var/www
    networks:
      - dev

networks:
  dev:

volumes:
  db-data:
