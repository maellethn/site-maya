# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    filter_sets:
        carre:
            quality: 80
            filters:
                thumbnail:
                    size: [200, 200]
                    mode: inset
        collection:
            quality: 80
            filters:
                scale:
                    dim: [500, 7000]

        maxWidth:
            quality: 80
            filters:
                relative_resize:
                    widen: 500



        quality:
            quality: 80
